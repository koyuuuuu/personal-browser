name: iOS tests and unsigned IPA

# Manual execution controls macOS usage in the private, free-tier-only setup.
on:
  workflow_dispatch:
    inputs:
      build_ipa:
        description: 'Create an unsigned device IPA after tests pass'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BROWSER_BUNDLE_ID: ${{ vars.BROWSER_BUNDLE_ID || 'local.personalbrowser.app' }}
      BROWSER_XCODE_PATH: ${{ vars.BROWSER_XCODE_PATH }}
      BUILD_IPA: ${{ inputs.build_ipa && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test and build
        run: bash scripts/ios_ci.sh
      - name: Upload unsigned IPA and build information
        if: success() && inputs.build_ipa
        uses: actions/upload-artifact@v4
        with:
          name: PersonalBrowser-${{ github.run_number }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error
      - name: Export UI failure attachments
        if: failure()
        run: |
          for result in build/UI-*.xcresult; do
            if [ -d "$result" ]; then
              xcrun xcresulttool export attachments --path "$result" --output-path build/test-attachments --only-failures || true
            fi
          done
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-failure-logs-${{ github.run_number }}
          path: |
            build/*.log
            build/test-attachments/**
          retention-days: 1
          if-no-files-found: ignore
